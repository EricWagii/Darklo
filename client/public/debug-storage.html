<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>存储诊断工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: #d4af37;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        h2 {
            color: #d4af37;
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 20px;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 10px;
        }
        
        .section {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .key-value {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 20px;
            margin-bottom: 15px;
            padding: 10px;
            background: #0f0f0f;
            border-radius: 4px;
            border-left: 3px solid #d4af37;
        }
        
        .key {
            font-weight: bold;
            color: #d4af37;
            word-break: break-all;
        }
        
        .value {
            color: #b0b0b0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            word-break: break-all;
            white-space: pre-wrap;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 10px 20px;
            background: #d4af37;
            color: #0a0a0a;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #e0c158;
            transform: translateY(-2px);
        }
        
        button.danger {
            background: #ff4444;
            color: white;
        }
        
        button.danger:hover {
            background: #ff6666;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: #0f0f0f;
            border: 1px solid #d4af37;
            border-radius: 4px;
            padding: 15px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #d4af37;
        }
        
        .stat-label {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        
        .status {
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        .status.success {
            background: #1a3a1a;
            border: 1px solid #4a8f4a;
            color: #7eff7e;
        }
        
        .status.error {
            background: #3a1a1a;
            border: 1px solid #8f4a4a;
            color: #ff7e7e;
        }
        
        .status.warning {
            background: #3a3a1a;
            border: 1px solid #8f8f4a;
            color: #ffff7e;
        }
        
        .empty {
            color: #888;
            font-style: italic;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 存储诊断工具</h1>
        
        <div class="button-group">
            <button onclick="refreshData()">🔄 刷新数据</button>
            <button onclick="exportData()">📥 导出数据</button>
            <button class="danger" onclick="clearAllStorage()">🗑️ 清空所有存储</button>
            <button class="danger" onclick="clearEMGData()">🗑️ 仅清空EMG数据</button>
        </div>
        
        <div id="status"></div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="localStorageCount">0</div>
                <div class="stat-label">localStorage 键数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="indexedDBCount">0</div>
                <div class="stat-label">IndexedDB 数据库数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="emgCommandsSize">0 B</div>
                <div class="stat-label">emg-commands 大小</div>
            </div>
        </div>
        
        <div class="section">
            <h2>📦 localStorage 数据</h2>
            <div id="localStorageContent"></div>
        </div>
        
        <div class="section">
            <h2>🗄️ IndexedDB 数据库</h2>
            <div id="indexedDBContent"></div>
        </div>
    </div>
    
    <script>
        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }
        
        function showStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            const className = type === 'success' ? 'success' : type === 'error' ? 'error' : 'warning';
            statusEl.innerHTML = `<div class="status ${className}">${message}</div>`;
        }
        
        function refreshData() {
            // 刷新 localStorage
            const localStorageContent = document.getElementById('localStorageContent');
            if (localStorage.length === 0) {
                localStorageContent.innerHTML = '<div class="empty">localStorage 为空</div>';
                document.getElementById('localStorageCount').textContent = '0';
            } else {
                let html = '';
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    const value = localStorage.getItem(key);
                    const size = formatBytes(new Blob([value]).size);
                    html += `<div class="key-value">
                        <div class="key">${key} (${size})</div>
                        <div class="value">${value}</div>
                    </div>`;
                }
                localStorageContent.innerHTML = html;
                document.getElementById('localStorageCount').textContent = localStorage.length;
            }
            
            // 刷新 IndexedDB
            const indexedDBContent = document.getElementById('indexedDBContent');
            indexedDB.databases().then(dbs => {
                if (dbs.length === 0) {
                    indexedDBContent.innerHTML = '<div class="empty">没有 IndexedDB 数据库</div>';
                    document.getElementById('indexedDBCount').textContent = '0';
                } else {
                    let html = '';
                    dbs.forEach(db => {
                        html += `<div class="key-value">
                            <div class="key">${db.name}</div>
                            <div class="value">版本: ${db.version}</div>
                        </div>`;
                    });
                    indexedDBContent.innerHTML = html;
                    document.getElementById('indexedDBCount').textContent = dbs.length;
                }
            });
            
            // 计算 emg-commands 大小
            const emgCommands = localStorage.getItem('emg-commands');
            if (emgCommands) {
                const size = formatBytes(new Blob([emgCommands]).size);
                document.getElementById('emgCommandsSize').textContent = size;
            } else {
                document.getElementById('emgCommandsSize').textContent = '0 B';
            }
            
            showStatus('✅ 数据已刷新', 'success');
        }
        
        function clearAllStorage() {
            if (!confirm('⚠️ 确定要清空所有存储吗？这将删除所有 localStorage 和 IndexedDB 数据。')) {
                return;
            }
            
            // 清空 localStorage
            localStorage.clear();
            
            // 清空 IndexedDB
            indexedDB.databases().then(dbs => {
                dbs.forEach(db => {
                    indexedDB.deleteDatabase(db.name);
                });
                showStatus('✅ 所有存储已清空', 'success');
                setTimeout(refreshData, 500);
            });
        }
        
        function clearEMGData() {
            if (!confirm('⚠️ 确定要清空所有 EMG 相关数据吗？')) {
                return;
            }
            
            // 清空 localStorage 中的 EMG 相关键
            const keysToRemove = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && (key.includes('emg') || key.includes('command') || key.includes('recognition'))) {
                    keysToRemove.push(key);
                }
            }
            
            keysToRemove.forEach(key => {
                localStorage.removeItem(key);
                console.log(`已删除: ${key}`);
            });
            
            // 清空 IndexedDB 中的 emg-database
            indexedDB.deleteDatabase('emg-database');
            
            showStatus(`✅ 已清空 ${keysToRemove.length} 个 EMG 相关键和 IndexedDB`, 'success');
            setTimeout(refreshData, 500);
        }
        
        function exportData() {
            const data = {
                localStorage: {},
                timestamp: new Date().toISOString()
            };
            
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                data.localStorage[key] = localStorage.getItem(key);
            }
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `storage-export-${Date.now()}.json`;
            a.click();
            
            showStatus('✅ 数据已导出', 'success');
        }
        
        // 页面加载时刷新数据
        window.addEventListener('load', refreshData);
    </script>
</body>
</html>
