<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统初始化 - 清空所有数据</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 14px;
            color: #555;
            line-height: 1.6;
        }
        .warning-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 14px;
            color: #856404;
            line-height: 1.6;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-init {
            background: #667eea;
            color: white;
        }
        .btn-init:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .btn-cancel {
            background: #e0e0e0;
            color: #333;
        }
        .btn-cancel:hover {
            background: #d0d0d0;
        }
        .log-box {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #333;
            margin-top: 20px;
            display: none;
        }
        .log-box.active {
            display: block;
        }
        .log-entry {
            margin-bottom: 5px;
            line-height: 1.4;
        }
        .log-entry.success {
            color: #27ae60;
        }
        .log-entry.error {
            color: #e74c3c;
        }
        .log-entry.info {
            color: #3498db;
        }
        .status {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        .status.complete {
            color: #27ae60;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 系统初始化</h1>
        <p class="subtitle">清空所有用户数据和采集记录</p>
        
        <div class="info-box">
            <strong>系统状态：</strong> 准备清空所有数据
            <br>此操作将删除所有采集数据、识别记录和用户信息。
        </div>
        
        <div class="warning-box">
            <strong>⚠️ 警告：</strong> 此操作不可撤销！请确保你已备份重要数据。
        </div>
        
        <div class="button-group">
            <button class="btn-init" onclick="initializeSystem()">确认初始化</button>
            <button class="btn-cancel" onclick="goBack()">返回</button>
        </div>
        
        <div id="logBox" class="log-box">
            <div id="logContent"></div>
        </div>
        
        <div id="status" class="status"></div>
    </div>

    <script>
        function addLog(message, type = 'info') {
            const logBox = document.getElementById('logBox');
            const logContent = document.getElementById('logContent');
            
            if (!logBox.classList.contains('active')) {
                logBox.classList.add('active');
            }
            
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContent.appendChild(entry);
            
            // 自动滚动到底部
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function initializeSystem() {
            try {
                addLog('开始系统初始化...', 'info');
                
                // 1. 清空IndexedDB
                addLog('【步骤1】清空所有IndexedDB数据库...', 'info');
                const dbs = await indexedDB.databases();
                addLog(`找到的数据库: ${dbs.map(d => d.name).join(', ')}`, 'info');
                
                for (const dbInfo of dbs) {
                    addLog(`正在删除数据库: ${dbInfo.name}`, 'info');
                    await new Promise((resolve, reject) => {
                        const request = indexedDB.deleteDatabase(dbInfo.name);
                        request.onsuccess = () => {
                            addLog(`✓ 数据库已删除: ${dbInfo.name}`, 'success');
                            resolve();
                        };
                        request.onerror = () => {
                            addLog(`✗ 删除数据库失败: ${dbInfo.name}`, 'error');
                            reject(request.error);
                        };
                    });
                }
                
                // 2. 清空localStorage
                addLog('', 'info');
                addLog('【步骤2】清空localStorage...', 'info');
                const allKeys = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key) {
                        allKeys.push(key);
                    }
                }
                addLog(`找到的localStorage键: ${allKeys.join(', ')}`, 'info');
                allKeys.forEach(key => {
                    localStorage.removeItem(key);
                    addLog(`✓ 已删除localStorage键: ${key}`, 'success');
                });
                addLog(`localStorage清空完成，剩余键数: ${localStorage.length}`, 'success');
                
                // 3. 清空sessionStorage
                addLog('', 'info');
                addLog('【步骤3】清空sessionStorage...', 'info');
                sessionStorage.clear();
                addLog('✓ sessionStorage已清空', 'success');
                
                // 4. 清空cookies
                addLog('', 'info');
                addLog('【步骤4】清空cookies...', 'info');
                document.cookie.split(";").forEach((c) => {
                    document.cookie = c
                        .replace(/^ +/, "")
                        .replace(/=.*/, `=;expires=${new Date().toUTCString()};path=/`);
                });
                addLog('✓ Cookies已清空', 'success');
                
                // 5. 验证清空结果
                addLog('', 'info');
                addLog('【步骤5】验证清空结果...', 'info');
                addLog(`localStorage键数: ${localStorage.length}`, 'info');
                addLog(`sessionStorage键数: ${sessionStorage.length}`, 'info');
                
                addLog('', 'info');
                addLog('✓ 系统初始化完成！所有数据已彻底清空。', 'success');
                
                const status = document.getElementById('status');
                status.textContent = '✓ 初始化完成！页面将在3秒后自动刷新...';
                status.classList.add('complete');
                
                // 3秒后刷新页面
                setTimeout(() => {
                    window.location.href = '/';
                }, 3000);
                
            } catch (error) {
                addLog(`✗ 初始化失败: ${error.message}`, 'error');
                const status = document.getElementById('status');
                status.textContent = '✗ 初始化失败，请查看日志了解详情';
            }
        }

        function goBack() {
            window.location.href = '/';
        }
    </script>
</body>
</html>
